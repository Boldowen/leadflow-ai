services:
  db:
    image: postgres:16-alpine
    container_name: leadflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: leadflow
      POSTGRES_DB: leadflow
    ports:
      - "5435:5432"
    volumes:
      - leadflow-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://leadflow:leadflow@db:5432/leadflow?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "3100:3000"

volumes:
  leadflow-pg:
